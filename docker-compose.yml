services:
  db:
    image: postgres:16-alpine
    container_name: sik6-db-dev
    restart: unless-stopped
    env_file:
      - .env.development
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/internal/storage/postgres/migrations:/migrations:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sik6-api-dev
    env_file:
      - .env.development
    environment:
      DB_HOST: db
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ./.env.development:/app/.env.development:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sik6-web-dev
    working_dir: /app
    command: sh -c "npm run start -- --host 0.0.0.0 --proxy-config src/proxy.conf.json"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:4200/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:




