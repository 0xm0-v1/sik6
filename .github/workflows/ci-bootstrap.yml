name: CI Bootstrap

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install Go tooling
        run: |
          go install mvdan.cc/gofumpt@latest
        working-directory: backend

      - name: Check Go formatting
        run: |
          FORMAT_OUTPUT="$(gofumpt -l .)"
          if [[ -n "${FORMAT_OUTPUT}" ]]; then
            echo "Go files need gofumpt formatting:"
            echo "${FORMAT_OUTPUT}"
            exit 1
          fi
        working-directory: backend

      - name: Install Go dependencies
        run: go mod download
        working-directory: backend

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          working-directory: backend
          args: ./...

      - name: Go build
        run: go build ./cmd/sik6
        working-directory: backend

      - name: Go test
        run: go test ./...
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Angular lint
        run: npm run lint:check
        working-directory: frontend

      - name: Angular tests
        run: npm run test:ci
        working-directory: frontend

      - name: Angular build
        run: npm run build -- --configuration production
        working-directory: frontend

  docker-smoke:
    name: Docker Smoke
    runs-on: ubuntu-latest
    needs: quality
    env:
      APP_ENV_FILE: .env.ci
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Pull database image
        run: docker compose --project-name sik6-ci --env-file .env.ci pull db

      - name: Build application images
        run: docker compose --project-name sik6-ci --env-file .env.ci build api web

      - name: Run stack smoke tests
        run: bash scripts/ci/stack-smoke.sh

      - name: Collect logs on failure
        if: failure()
        run: docker compose --project-name sik6-ci --env-file .env.ci logs
